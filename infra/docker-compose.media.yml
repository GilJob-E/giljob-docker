# Optional media ingress overlay for the same single-server Compose stack.
# This file is fail-closed: it cannot render without explicit LiveKit/TURN secrets.
# Local self-hosted mode uses LIVEKIT_INTERNAL_URL for containers and
# LIVEKIT_PUBLIC_URL for browser clients; LiveKit Cloud is not required.
name: giljob-v2

services:
  api:
    environment:
      LIVEKIT_REQUIRED: "true"
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-ws://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?set LIVEKIT_PUBLIC_URL before enabling media overlay}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY before enabling media overlay}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET before enabling media overlay}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-7200}

  analysis-engine:
    environment:
      LIVEKIT_URL: ${LIVEKIT_INTERNAL_URL:-ws://livekit:7880}
      LIVEKIT_SESSION_ID: ${LIVEKIT_SESSION_ID:-local-demo}
      # Legacy scaffold flag. The GilJobE server (python -m giljobe.server) starts the subscriber
      # per turn via POST /subscriber/start, so this value is not consulted by the runtime.
      ANALYSIS_ENGINE_ENABLE_SUBSCRIBER: ${ANALYSIS_ENGINE_ENABLE_SUBSCRIBER:-false}
    depends_on:
      - livekit

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY before enabling media overlay}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET before enabling media overlay}
        turn:
          enabled: false

  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.6.3-alpine}
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:?set TURN_REALM before enabling media overlay}
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET before enabling media overlay}
