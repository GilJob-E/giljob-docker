# Initial app scaffold only. Add infra/docker-compose.media.yml for media ingress.
name: giljob-v2

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8-alpine}
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

  web:
    build: ../apps/web
    expose:
      - "3000"

  api:
    build: ../services/api
    environment:
      GILJOB_ENV: ${GILJOB_ENV:-development}
      SESSION_TOKEN_TTL_SECONDS: ${SESSION_TOKEN_TTL_SECONDS:-7200}
      REPORT_TOKEN_TTL_SECONDS: ${REPORT_TOKEN_TTL_SECONDS:-2592000}
      SESSION_TOKEN_HASH_SECRET: ${SESSION_TOKEN_HASH_SECRET:?set SESSION_TOKEN_HASH_SECRET in .env before running compose}
      REPORT_TOKEN_HASH_SECRET: ${REPORT_TOKEN_HASH_SECRET:?set REPORT_TOKEN_HASH_SECRET in .env before running compose}
      LIVEKIT_REQUIRED: ${LIVEKIT_REQUIRED:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-7200}
      AI_ENGINE_INTERNAL_URL: ${AI_ENGINE_INTERNAL_URL:-http://ai-engine:8100}
    expose:
      - "8000"
    depends_on:
      - postgres

  ai-engine:
    build: ../services/ai-engine
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-fake}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_22050_32}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-3.1-flash-tts-preview}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Kore}
      TTS_PROVIDER_FAILURE_FALLBACK: ${TTS_PROVIDER_FAILURE_FALLBACK:-}
      AVATAR_PROVIDER: ${AVATAR_PROVIDER:-disabled}
      SPATIALREAL_API_KEY: ${SPATIALREAL_API_KEY:-}
      SPATIALREAL_APP_ID: ${SPATIALREAL_APP_ID:-}
      SPATIALREAL_AVATAR_ID: ${SPATIALREAL_AVATAR_ID:-}
      SPATIALREAL_CONSOLE_ENDPOINT: ${SPATIALREAL_CONSOLE_ENDPOINT:-}
      SPATIALREAL_INGRESS_ENDPOINT: ${SPATIALREAL_INGRESS_ENDPOINT:-}
      SPATIALREAL_REGION: ${SPATIALREAL_REGION:-ap-northeast}
      SPATIALREAL_SESSION_TTL_SECONDS: ${SPATIALREAL_SESSION_TTL_SECONDS:-900}
      AVATAR_PROVIDER_FAILURE_FALLBACK: ${AVATAR_PROVIDER_FAILURE_FALLBACK:-}
      SPATIALREAL_AUDIO_SAMPLE_RATE: ${SPATIALREAL_AUDIO_SAMPLE_RATE:-16000}
      SPATIALREAL_AUDIO_CHANNEL_COUNT: ${SPATIALREAL_AUDIO_CHANNEL_COUNT:-1}
      SPATIALREAL_RTC_EGRESS_ENABLED: ${SPATIALREAL_RTC_EGRESS_ENABLED:-false}
      SPATIALREAL_RTC_LIVEKIT_URL: ${SPATIALREAL_RTC_LIVEKIT_URL:-}
      SPATIALREAL_RTC_PUBLISHER_ID_PREFIX: ${SPATIALREAL_RTC_PUBLISHER_ID_PREFIX:-spatialreal-avatar}
      SPATIALREAL_RTC_IDLE_TIMEOUT_SECONDS: ${SPATIALREAL_RTC_IDLE_TIMEOUT_SECONDS:-30}
      SPATIALREAL_RTC_SETTLE_SECONDS: ${SPATIALREAL_RTC_SETTLE_SECONDS:-1.0}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # hashimoto strategy pull (non-blocking, best-effort). Empty -> ai-engine runs transcript-only.
      HASHIMOTO_BASE_URL: ${HASHIMOTO_BASE_URL:-http://hashimoto:8200}
    expose:
      - "8100"
    depends_on:
      - hashimoto

  hashimoto:
    build: ../services/hashimoto
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HASHIMOTO_ANALYSIS_MODEL: ${HASHIMOTO_ANALYSIS_MODEL:-gemini-3.1-flash-lite}
    expose:
      - "8200"          # internal only -- no ports:, no Caddy route

  analysis-engine:
    build: ../services/analysis-engine
    environment:
      SERVICE_NAME: analysis-engine
      SERVICE_PORT: 8200
      GILJOBE_GIT_URL: ${GILJOBE_GIT_URL:-https://github.com/GilJob-E/GilJobE.git}
      GILJOBE_GIT_REF: ${GILJOBE_GIT_REF:-b769120}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://giljob-v2-gemma-e4b:8000}
      ANALYSIS_ENGINE_ENABLE_SUBSCRIBER: ${ANALYSIS_ENGINE_ENABLE_SUBSCRIBER:-false}
      LIVEKIT_URL: ${LIVEKIT_INTERNAL_URL:-ws://livekit:7880}
      LIVEKIT_SESSION_ID: ${LIVEKIT_SESSION_ID:-local-demo}
      LIVEKIT_IDENTITY: ${LIVEKIT_IDENTITY:-giljobe-analysis}
      LIVEKIT_TOKEN: ${LIVEKIT_ANALYZER_TOKEN:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    expose:
      - "8200"
    depends_on:
      - api
      - ai-engine

  agent1:
    build: ../services/agent1
    expose:
      - "8010"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giljob}
      POSTGRES_USER: ${POSTGRES_USER:-giljob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before running compose}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    profiles: ["redis"]
    expose:
      - "6379"

volumes:
  postgres-data:
